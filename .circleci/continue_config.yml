      - run:
          name: steps::setup_linux
          command: ./script/linux
      - run:
          name: steps::download_wasi_sdk
          command: ./script/download-wasi-sdk
      - run:
          name: ./script/bundle-linux
          no_output_timeout: 60m
          command: ./script/bundle-linux
      - store_artifacts:
          path: target/release/zed-linux-<< parameters.arch >>.tar.gz
          destination: zed-linux-<< parameters.arch >>.tar.gz
      - store_artifacts:
