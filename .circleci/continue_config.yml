          path: target/Zed-<< parameters.arch >>.exe
          destination: Zed-<< parameters.arch >>.exe
      - store_artifacts:
          path: target/zed-remote-server-windows-<< parameters.arch >>.zip
          destination: zed-remote-server-windows-<< parameters.arch >>.zip
      - save_rust_cache_windows:
          prefix: bundle-windows-<< parameters.arch >>

workflows:
  test:
    jobs:
      - check_style:
          context: [zed-ci]
      - clippy_linux:
          context: [zed-ci]
      - clippy_macos:
          name: clippy_mac
          cache_prefix: clippy-mac
          context: [zed-ci]
      - clippy_macos:
          name: clippy_mac_x86_64
          cache_prefix: clippy-mac-x86-64
          add_x86_target: true
          target_flag: "--target x86_64-apple-darwin"
          context: [zed-ci]
      - clippy_windows:
          context: [zed-ci]
      - run_tests_linux:
          context: [zed-ci]
      - run_tests_mac:
          context: [zed-ci]
      - run_tests_windows:
          context: [zed-ci]
      - miri_scheduler:
          context: [zed-ci]
      - doctests:
          context: [zed-ci]
      - check_workspace_binaries:
          context: [zed-ci]
      - build_visual_tests_binary:
          context: [zed-ci]
      - check_wasm:
          context: [zed-ci]
      - check_dependencies:
          context: [zed-ci]
      - check_docs:
          context: [zed-ci]
      - check_licenses:
          context: [zed-ci]
      - check_scripts:
          context: [zed-ci]
      - check_postgres_and_protobuf_migrations:
          context: [zed-ci]
      - extension_tests:
          context: [zed-ci]
      # check_postgres_and_protobuf_migrations is deliberately absent from this
      # list: run_tests.yml's tests_pass does not list it in `needs` either.
      - tests_pass:
          requires:
            - check_style
            - clippy_linux
            - clippy_mac
            - clippy_mac_x86_64
            - clippy_windows
            - run_tests_linux
            - run_tests_mac
            - run_tests_windows
            - miri_scheduler
            - doctests
            - check_workspace_binaries
            - build_visual_tests_binary
            - check_wasm
            - check_dependencies
            - check_docs
            - check_licenses
            - check_scripts
            - extension_tests

  danger:
    jobs:
      - danger

  nix:
    # nix_build.yml fires for either the run-nix or the run-bundling label.
    when:
      or:
        - << pipeline.parameters.run_nix >>
        - << pipeline.parameters.run_bundling >>
    jobs:
      - build_nix_linux_x86_64:
          context: [zed-ci]
      - build_nix_mac_aarch64:
          context: [zed-ci]

  bundling:
    when: << pipeline.parameters.run_bundling >>
    jobs:
      - bundle_linux:
          name: bundle_linux_aarch64
          arch: aarch64
          resource_class: arm.xlarge
          context: [zed-ci]
      - bundle_linux:
          name: bundle_linux_x86_64
          arch: x86_64
          resource_class: 2xlarge
          context: [zed-ci]
      - build_static_bwrap:
          name: build_static_bwrap_linux_aarch64
          arch: aarch64
          resource_class: arm.xlarge
          context: [zed-ci]
      - build_static_bwrap:
          name: build_static_bwrap_linux_x86_64
          arch: x86_64
          resource_class: 2xlarge
          context: [zed-ci]
      - bundle_mac:
          name: bundle_mac_aarch64
          target: aarch64-apple-darwin
          arch: aarch64
          context: [zed-ci]
      - bundle_mac:
          name: bundle_mac_x86_64
          target: x86_64-apple-darwin
          arch: x86_64
          context: [zed-ci]
      - bundle_windows:
          name: bundle_windows_aarch64
          arch: aarch64
          context: [zed-ci]
      - bundle_windows:
          name: bundle_windows_x86_64
          arch: x86_64
          context: [zed-ci]
