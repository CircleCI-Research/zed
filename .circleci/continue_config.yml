      - run:
          name: run_bundling::build_static_bwrap::cachix
          command: |
            nix profile install nixpkgs#cachix
            if [ -n "${CACHIX_AUTH_TOKEN:-}" ]; then
              cachix authtoken "$CACHIX_AUTH_TOKEN"
            fi
            cachix use zed
      - run:
          name: run_bundling::build_static_bwrap::build
